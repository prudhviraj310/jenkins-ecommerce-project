version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      # Using the variable passed from the Jenkinsfile
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: 'ecommerce_db'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network

  backend-api:
    image: prudhviraj310/ecommerce-backend:latest
    container_name: ecommerce-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=ecommerce_db
    depends_on:
      - db
    restart: always
    networks:
      - ecommerce-network

  frontend-app:
    image: prudhviraj310/ecommerce-frontend:latest
    container_name: ecommerce-frontend
    ports:
      - "3000:3000"  # Changed to 3000 to match standard Node/React dev ports
    environment:
      - REACT_APP_API_URL=${API_URL} # Injected from Jenkins to connect to 13.232.223.27
    depends_on:
      - backend-api
    restart: always
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql_data: